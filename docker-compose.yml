version: "3.9"
services:
  backend:
    image: node:20
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: supersecret
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  processor:
    image: python:3.11
    working_dir: /app
    volumes:
      - ./processor:/app
      - ./backend:/backend
    command: sh -c "pip install -r requirements.txt && python tasks.py --document-id demo-doc --file /backend/uploads/sample.pdf"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BACKEND_ROOT: /backend
